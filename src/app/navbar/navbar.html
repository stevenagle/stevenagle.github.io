<header class="header">
  <nav class="navbar page-width" aria-label="Main navigation">
    <a class="wordmark" href="#about-me" (click)="navigate('about-me')" aria-label="Steven Nagle, back to introduction">
      Steven Nagle
    </a>
    <button #menuToggle class="menu-toggle" type="button" (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()" aria-controls="navigation-links"
      [attr.aria-label]="menuOpen() ? 'Close navigation' : 'Open navigation'">
      <span>{{ menuOpen() ? 'Close' : 'Menu' }}</span>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        @if (menuOpen()) {
          <path d="m6 6 12 12M6 18 18 6" />
        } @else {
          <path d="M4 8h16M4 16h16" />
        }
      </svg>
    </button>
    <ul id="navigation-links" class="nav-list" [class.open]="menuOpen()">
      <li><a href="#about-me" (click)="navigate('about-me')" [attr.aria-current]="activeSection() === 'about-me' ? 'location' : null">About</a></li>
      <li><a href="#experience" (click)="navigate('experience')" [attr.aria-current]="activeSection() === 'experience' ? 'location' : null">Experience</a></li>
      <li><a href="#contact" (click)="navigate('contact')" [attr.aria-current]="activeSection() === 'contact' ? 'location' : null">Contact <span aria-hidden="true">↗</span></a></li>
    </ul>
  </nav>
</header>
